<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Excedere CRM</title>
<link rel="icon" type="image/png" href="excedere-logo.png">
<link rel="apple-touch-icon" href="excedere-logo.png">
<style>
:root{--bg:#06110e;--panel:#0a1915;--panel2:#0d1e19;--border:#223c32;--border2:#193128;--text:#f0f7f4;--muted:#8da89d;--green:#35d07f;--green2:#113e2b;--amber:#e9b44c;--red:#ef6d6d}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{background:linear-gradient(180deg,#06110e,#07140f);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:235px 1fr}.sidebar{height:100vh;position:sticky;top:0;padding:20px 16px;border-right:1px solid var(--border);background:#05100d}.brand{display:flex;align-items:center;gap:12px;margin-bottom:32px}.brand img{width:50px;height:50px;border-radius:50%}.brand-name{font-weight:800;letter-spacing:.18em}.brand-sub{color:var(--green);font-size:9px;letter-spacing:.25em;margin-top:3px}.nav{display:flex;flex-direction:column;gap:7px}.nav button{min-height:44px;border:1px solid transparent;border-radius:8px;background:transparent;color:#cbd8d3;text-align:left;padding:0 13px;font-weight:700}.nav button.active{background:var(--green2);border-color:var(--border);color:var(--green)}.sidebar-footer{position:absolute;left:16px;right:16px;bottom:18px}.open-ca{width:100%;min-height:43px;border:1px solid var(--green);border-radius:8px;background:var(--green2);color:var(--green);font-weight:800}.main{min-width:0}.topbar{min-height:70px;display:grid;grid-template-columns:1fr minmax(300px,480px);gap:18px;align-items:center;padding:10px 24px;border-bottom:1px solid var(--border);background:#06110ef2;position:sticky;top:0;z-index:5}.page-title{font-size:18px;font-weight:800}.page-sub{font-size:10px;color:var(--muted);margin-top:3px}.search{width:100%;height:42px;border:1px solid var(--border);border-radius:9px;background:#0b1a16;color:var(--text);padding:0 14px;outline:none}.content{padding:22px 24px 40px}.view{display:none}.view.active{display:block}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:11px;margin-bottom:18px}.stat,.card{border:1px solid var(--border);border-radius:11px;background:#0b1c16e6}.stat{padding:15px}.label{color:var(--muted);font-size:8px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.num{font-size:27px;font-weight:850;margin-top:8px}.num.green{color:var(--green)}.num.amber{color:var(--amber)}.num.red{color:var(--red)}.dash-grid{display:grid;grid-template-columns:1.4fr .8fr;gap:14px}.card-head{padding:13px 15px;border-bottom:1px solid var(--border);color:var(--green);font-size:9px;font-weight:850;letter-spacing:.14em}.card-body{padding:12px 15px}.activity,.follow{padding:11px 0;border-bottom:1px solid var(--border2)}.activity:last-child,.follow:last-child{border-bottom:0}.small{font-size:9px;color:var(--muted);margin-top:3px}.status{display:inline-block;padding:4px 7px;border-radius:999px;font-size:8px;font-weight:850}.new{color:var(--muted);border:1px solid var(--border)}.current{color:var(--green);border:1px solid var(--green)}.due{color:var(--amber);border:1px solid var(--amber)}.overdue{color:var(--red);border:1px solid var(--red)}.contacts-layout{display:grid;grid-template-columns:1fr 380px;gap:14px}.contact-head,.contact-row{display:grid;grid-template-columns:1.2fr 1.3fr 1.2fr .9fr .8fr;gap:10px}.contact-head{padding:10px 13px;border-bottom:1px solid var(--border);color:var(--muted);font-size:8px;font-weight:800}.contact-row{width:100%;padding:12px 13px;border:0;border-bottom:1px solid var(--border2);background:transparent;color:var(--text);text-align:left}.contact-row:hover,.contact-row.selected{background:var(--green2)}.detail{height:fit-content;position:sticky;top:92px}.detail-top{padding:17px;border-bottom:1px solid var(--border)}.detail-name{font-size:21px;font-weight:850}.detail-body{padding:13px 16px}.detail-item{padding:9px 0;border-bottom:1px solid var(--border2)}.detail-label{font-size:7px;color:var(--muted);font-weight:800;letter-spacing:.1em;margin-bottom:4px}.detail-value{font-size:10px;line-height:1.45}.detail-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:13px}.detail-btn{min-height:40px;border:1px solid var(--border);border-radius:7px;background:var(--panel2);color:var(--text);font-weight:750}.detail-btn.primary{background:var(--green);color:#03120b;border:0}.pipeline-select{width:100%;height:38px;background:#08140f;color:var(--text);border:1px solid var(--border);border-radius:7px}.pipeline{display:grid;grid-template-columns:repeat(7,minmax(220px,1fr));gap:10px;overflow-x:auto}.pcol{min-height:500px;border:1px solid var(--border);border-radius:10px;background:#0b1c16b3}.phead{padding:11px 12px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between}.pcard{margin:8px;padding:11px;border:1px solid var(--border);border-radius:8px;background:#091713}.empty{padding:30px;color:var(--muted);text-align:center}@media(max-width:1250px){.stats{grid-template-columns:repeat(3,1fr)}.contacts-layout{grid-template-columns:1fr}.detail{position:static}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
<div class="brand"><img src="excedere-logo.png" alt="Excedere"><div><div class="brand-name">EXCEDERE</div><div class="brand-sub">CRM</div></div></div>
<nav class="nav">
<button class="active" onclick="switchView('dashboard',this)">⌂ Dashboard</button>
<button onclick="switchView('contacts',this)">◎ Contacts</button>
<button onclick="switchView('pipeline',this)">▦ Pipeline</button>
<button onclick="switchView('followups',this)">✓ Follow-Ups</button>
</nav>
<div class="sidebar-footer"><button class="open-ca" onclick="openCallAssist()">☎ Open Call Assist</button></div>
</aside>
<section class="main">
<header class="topbar"><div><div id="pageTitle" class="page-title">Dashboard</div><div id="pageSub" class="page-sub">Your Excedere sales activity at a glance.</div></div><input id="globalSearch" class="search" placeholder="Search prospects, company, phone, email or role..."></header>
<div class="content">
<section id="dashboardView" class="view active"><div class="stats">
<div class="stat"><div class="label">Total Prospects</div><div id="statProspects" class="num">0</div></div>
<div class="stat"><div class="label">Follow-Ups Due</div><div id="statDue" class="num amber">0</div></div>
<div class="stat"><div class="label">Overdue</div><div id="statOverdue" class="num red">0</div></div>
<div class="stat"><div class="label">Meetings Booked</div><div id="statMeetings" class="num green">0</div></div>
<div class="stat"><div class="label">Calls Logged</div><div id="statCalls" class="num">0</div></div>
</div><div class="dash-grid"><div class="card"><div class="card-head">RECENT ACTIVITY</div><div id="recentActivity" class="card-body"></div></div><div class="card"><div class="card-head">NEXT FOLLOW-UPS</div><div id="dashboardFollowups" class="card-body"></div></div></div></section>
<section id="contactsView" class="view"><div class="contacts-layout"><div class="card"><div class="contact-head"><div>CONTACT</div><div>COMPANY / ROLE</div><div>CONTACT DETAILS</div><div>FOLLOW-UP</div><div>STATUS</div></div><div id="contactsList"></div></div><div id="contactDetail" class="card detail"><div class="empty">Select a contact to view the record.</div></div></div></section>
<section id="pipelineView" class="view"><div id="pipelineBoard" class="pipeline"></div></section>
<section id="followupsView" class="view"><div class="card"><div id="followupList" class="card-body"></div></div></section>
</div></section></div>
<script>
const LEAD_STORAGE_KEY='excedereCallAssistLeads';
const CALL_ASSIST_URL='https://excederemanagementconsultancy.github.io/excedere-call-assist/';
const PIPELINE_STAGES=['New','Contacted','Follow-Up','Interested','Meeting Booked','Proposal','Won'];
let leads=[],selectedLeadId=null,currentSearch='';
function loadLeads(){try{const raw=localStorage.getItem(LEAD_STORAGE_KEY);if(!raw)return[];const p=JSON.parse(raw);if(!Array.isArray(p))return[];return p.map(l=>{l.pipelineStage??='New';l.callHistory??=[];l.emailHistory??=[];l.callCount??=0;l.lastOutcome??='';l.nextAction??='';l.nextFollowUpDate??='';return l})}catch(e){console.error(e);return[]}}
function saveLeads(){localStorage.setItem(LEAD_STORAGE_KEY,JSON.stringify(leads))}
function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
function byId(id){return leads.find(l=>l.id===id)}
function fmt(v){try{return v?new Date(v).toLocaleString():''}catch{return v||''}}
function days(date){if(!date)return null;const t=new Date();t.setHours(0,0,0,0);return Math.ceil((new Date(date+'T00:00:00')-t)/86400000)}
function status(l){if(!l.lastCalled&&!l.nextFollowUpDate)return{label:'NEW',cls:'new'};if(l.nextFollowUpDate){const d=days(l.nextFollowUpDate);if(d<0)return{label:'OVERDUE',cls:'overdue'};if(d<=2)return{label:'DUE SOON',cls:'due'}}return{label:'CURRENT',cls:'current'}}
function localTime(l){try{const tz=l.timezone||'America/Los_Angeles';const t=new Intl.DateTimeFormat('en-US',{timeZone:tz,hour:'numeric',minute:'2-digit'}).format(new Date());return t+(l.timezoneLabel?' '+l.timezoneLabel:'')}catch{return'Time unavailable'}}
function filtered(){if(!currentSearch)return leads;const q=currentSearch.toLowerCase();return leads.filter(l=>[l.firstName,l.title,l.company,l.role,l.location,l.phone,l.directPhone,l.email,l.lastOutcome,l.nextAction,l.pipelineStage].join(' ').toLowerCase().includes(q))}
function switchView(v,b){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));document.getElementById(v+'View').classList.add('active');b.classList.add('active');const m={dashboard:['Dashboard','Your Excedere sales activity at a glance.'],contacts:['Contacts','Manage prospects, communication and follow-ups.'],pipeline:['Pipeline','Track prospects through the sales process.'],followups:['Follow-Ups','See who needs your attention next.']};pageTitle.textContent=m[v][0];pageSub.textContent=m[v][1];renderAll()}
function renderDashboard(){let due=0,od=0,meet=0,calls=0;leads.forEach(l=>{const s=status(l);if(s.label==='DUE SOON')due++;if(s.label==='OVERDUE')od++;if(l.lastOutcome==='Appointment booked'||l.pipelineStage==='Meeting Booked')meet++;calls+=Number(l.callCount||0)});statProspects.textContent=leads.length;statDue.textContent=due;statOverdue.textContent=od;statMeetings.textContent=meet;statCalls.textContent=calls;renderRecent();renderDashFollow()}
function renderRecent(){const a=[];leads.forEach(l=>{(l.callHistory||[]).forEach(e=>a.push({type:'call',ts:e.timestamp,l,e}));(l.emailHistory||[]).forEach(e=>a.push({type:'email',ts:e.timestamp,l,e}))});a.sort((x,y)=>new Date(y.ts)-new Date(x.ts));recentActivity.innerHTML=a.length?a.slice(0,8).map(i=>`<div class="activity"><b>${i.type==='email'?'✉ Email sent to':'☎ Call with'} ${esc(i.l.firstName||i.l.company)}</b><div class="small">${esc(i.type==='email'?(i.e.subject||'Email'):(i.e.outcome||'Call logged'))} · ${esc(fmt(i.ts))}</div></div>`).join(''):'<div class="empty">No call or email activity has been recorded yet.</div>'}
function renderDashFollow(){const x=leads.filter(l=>l.nextFollowUpDate).sort((a,b)=>new Date(a.nextFollowUpDate)-new Date(b.nextFollowUpDate)).slice(0,7);dashboardFollowups.innerHTML=x.length?x.map(l=>{const s=status(l);return`<div class="follow"><b>${esc(l.firstName||'Unknown')}</b><div class="small">${esc(l.company||'')} · ${esc(l.nextAction||'Follow up')} · ${esc(l.nextFollowUpDate)} <span class="status ${s.cls}">${s.label}</span></div></div>`}).join(''):'<div class="empty">No follow-ups scheduled.</div>'}
function renderContacts(){const items=filtered();contactsList.innerHTML=items.length?items.map(l=>{const s=status(l);return`<button class="contact-row ${selectedLeadId===l.id?'selected':''}" onclick="selectContact('${l.id}')"><div><b>${esc(l.firstName||'Unknown')}</b><div class="small">${esc(l.title||'')}</div></div><div>${esc(l.company||'')}<div class="small">${esc(l.role||'')}</div></div><div>${esc(l.phone||l.directPhone||'No phone')}<div class="small">${esc(l.email||'No email')}</div></div><div>${esc(l.nextFollowUpDate||'None')}<div class="small">${esc(l.nextAction||'')}</div></div><div><span class="status ${s.cls}">${s.label}</span></div></button>`}).join(''):'<div class="empty">No matching contacts found.</div>';renderSelected()}
function selectContact(id){selectedLeadId=id;renderContacts()}
function activity(l){const a=[];(l.callHistory||[]).forEach(e=>a.push({type:'call',ts:e.timestamp,e}));(l.emailHistory||[]).forEach(e=>a.push({type:'email',ts:e.timestamp,e}));return a.sort((x,y)=>new Date(y.ts)-new Date(x.ts))}
function renderSelected(){if(!selectedLeadId){contactDetail.innerHTML='<div class="empty">Select a contact to view the record.</div>';return}const l=byId(selectedLeadId);if(!l){contactDetail.innerHTML='<div class="empty">Contact could not be found.</div>';return}const s=status(l),a=activity(l);contactDetail.innerHTML=`<div class="detail-top"><div class="detail-name">${esc(l.firstName||'Unknown')}</div><div class="small">${esc(l.title||'')}${l.title&&l.company?' · ':''}${esc(l.company||'')}</div></div><div class="detail-body"><div class="detail-item"><div class="detail-label">LOCAL TIME</div><div class="detail-value" style="color:var(--green)">${esc(localTime(l))}</div></div><div class="detail-item"><div class="detail-label">ROLE</div><div class="detail-value">${esc(l.role||'Not provided')}</div></div><div class="detail-item"><div class="detail-label">PHONE</div><div class="detail-value">${esc(l.phone||l.directPhone||'Not provided')}</div></div><div class="detail-item"><div class="detail-label">EMAIL</div><div class="detail-value">${esc(l.email||'Not provided')}</div></div><div class="detail-item"><div class="detail-label">LAST OUTCOME</div><div class="detail-value">${esc(l.lastOutcome||'None')}</div></div><div class="detail-item"><div class="detail-label">NEXT ACTION</div><div class="detail-value">${esc(l.nextAction||'None')}</div></div><div class="detail-item"><div class="detail-label">FOLLOW-UP</div><div class="detail-value">${esc(l.nextFollowUpDate||'None')} <span class="status ${s.cls}">${s.label}</span></div></div><div class="detail-item"><div class="detail-label">PIPELINE STAGE</div><select class="pipeline-select" onchange="updateStage('${l.id}',this.value)">${PIPELINE_STAGES.map(st=>`<option ${((l.pipelineStage||'New')===st)?'selected':''}>${esc(st)}</option>`).join('')}</select></div><div class="detail-actions"><button class="detail-btn primary" onclick="openLead('${l.id}')">☎ Call Assist</button><button class="detail-btn" onclick="emailLead('${l.id}')">✉ Email</button></div><div class="detail-item"><div class="detail-label">ACTIVITY HISTORY</div>${a.length?a.map(i=>`<div class="activity"><b>${i.type==='email'?'✉ Email sent':'☎ '+esc(i.e.outcome||'Call')}</b><div class="small">${esc(fmt(i.ts))}${i.type==='email'?' · '+esc(i.e.subject||'Email'):' · '+esc(i.e.nextAction||'')}</div></div>`).join(''):'<div class="small">No activity recorded yet.</div>'}</div></div>`}
function renderPipeline(){pipelineBoard.innerHTML=PIPELINE_STAGES.map(st=>{const x=filtered().filter(l=>(l.pipelineStage||'New')===st);return`<div class="pcol"><div class="phead"><b>${esc(st)}</b><span>${x.length}</span></div>${x.length?x.map(l=>`<div class="pcard"><b>${esc(l.firstName||'Unknown')}</b><div class="small">${esc(l.company||'')}</div><div class="small">${esc(l.nextAction||l.role||'')}</div></div>`).join(''):'<div class="empty">No prospects</div>'}</div>`}).join('')}
function renderFollowups(){const x=filtered().filter(l=>l.nextFollowUpDate).sort((a,b)=>new Date(a.nextFollowUpDate)-new Date(b.nextFollowUpDate));followupList.innerHTML=x.length?x.map(l=>{const s=status(l);return`<div class="follow"><b>${esc(l.firstName||'Unknown')}</b><div class="small">${esc(l.company||'')} · ${esc(l.role||'')} · ${esc(l.nextAction||'Follow up')} · ${esc(l.nextFollowUpDate)} <span class="status ${s.cls}">${s.label}</span></div></div>`}).join(''):'<div class="empty">No follow-ups currently scheduled.</div>'}
function updateStage(id,st){const l=byId(id);if(!l)return;l.pipelineStage=st;saveLeads();renderAll()}
function openCallAssist(){window.open(CALL_ASSIST_URL,'_blank')}
function openLead(id){if(!byId(id))return;localStorage.setItem('excedereSelectedLeadId',id);window.open(CALL_ASSIST_URL,'_blank')}
function emailLead(id){const l=byId(id);if(!l)return;const p=new URLSearchParams({leadId:l.id||'',name:l.firstName||'',company:l.company||'',email:l.email||''});window.open(CALL_ASSIST_URL+'email.html?'+p.toString(),'_blank')}
globalSearch.addEventListener('input',e=>{currentSearch=e.target.value.trim();renderAll()});function renderAll(){renderDashboard();renderContacts();renderPipeline();renderFollowups()}window.addEventListener('storage',e=>{if(e.key===LEAD_STORAGE_KEY){leads=loadLeads();renderAll()}});window.addEventListener('load',()=>{leads=loadLeads();if(leads.length)selectedLeadId=leads[0].id;renderAll()});
</script>
</body></html>
